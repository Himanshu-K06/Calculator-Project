<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator By Himanshu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator_body">
        <div class="display">            
            <div id = "whole_operation">747846565 - 931266458746 = </div>
            <div id="current_number"> 6654464687987969 </div>
        </div>
        <div class="button_grid">
            <div class="special_buttons">
                <button id="clear">Clear</button>
                <button id="delete">Backspace</button>
            </div>
            <div class="number_grid">
                <div class="first_line">
                    <button>/</button>
                    <button>x</button>
                    <button>-</button>
                    <button>+</button>
                </div>
                <div class="second_line">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                </div>
                <div class="third_line">
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                </div>
                <div class="fourth_line">
                    <button>9</button>
                    <button>0</button>
                    <button>.</button>
                    <button>=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="logic.js" defer></script>
</body>
</html>
