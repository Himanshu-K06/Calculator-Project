<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator By Himanshu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator_body">
        <div class="display">            
            <div id = "whole_operation"></div>
            <div id="current_number"></div>
        </div>
        <div class="button_grid">
            <div class="special_buttons">
                <button id="clear">Clear</button>
                <button id="backspace">Backspace</button>
            </div>
            <div class="number_grid">
                <div class="first_line">
                    <button class="operator" id="divide">/</button>
                    <button class="operator" id="multiply">x</button>
                    <button class="operator" id="minus">-</button>
                    <button class="operator" id="plus">+</button>
                </div>
                <div class="second_line">
                    <button class="number" id="one">1</button>
                    <button class="number" id="two">2</button>
                    <button class="number" id="three">3</button>
                    <button class="number" id="four">4</button>
                </div>
                <div class="third_line">
                    <button class="number" id="five">5</button>
                    <button class="number" id="six">6</button>
                    <button class="number" id="seven">7</button>
                    <button class="number" id="eight">8</button>
                </div>
                <div class="fourth_line">
                    <button class="number" id="nine">9</button>
                    <button class="number" id="zero">0</button>
                    <button id="decimal">.</button>
                    <button id="equals_to">=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="logic.js" defer></script>
</body>
</html>
